<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="AGENT 1 — Autonomous All-Terrain UGV with Robotic Arm & Edge AI by Blueprinters Team, Faculty of AI, Horus University in Egypt. NDTX Expo 2026.">
<title>AGENT 1 — Autonomous Ground Robot with a Robotic Arm | NDTX Expo 2026</title>
<style>
:root{
  --bg:#070b14; --bg-alt:#0a101c; --panel:rgba(14,23,38,.78); --panel-solid:#0e1726;
  --line:rgba(255,255,255,.08); --line-strong:#1e293b;
  --cyan:#00e5ff; --cyan-soft:#67e8f9; --cyan-dim:rgba(0,229,255,.35); --cyan-bg:#083344;
  --blue:#2563eb; --amber:#fbbf24;
  --text:#e2e8f0; --text-strong:#ffffff; --muted:#94a3b8; --ink:#04121a;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-block-start:92px}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Cairo","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,system-ui,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--cyan);color:#000}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:20px}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:Consolas,"SF Mono",Menlo,monospace}
.glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}

/* header */
header.top{position:sticky;inset-block-start:0;z-index:50;border-block-end:1px solid rgba(0,229,255,.2)}
.top .wrap{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,var(--blue));display:grid;place-items:center;color:#000;font-weight:800;font-size:19px;box-shadow:0 8px 20px rgba(0,229,255,.28);flex:none}
.brand-name{font-size:22px;font-weight:900;letter-spacing:.06em;color:var(--text-strong);display:flex;align-items:center;gap:8px;line-height:1.2}
.brand-name b{color:var(--cyan)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--cyan-bg);color:var(--cyan-soft);border:1px solid var(--cyan-dim);letter-spacing:.04em;font-weight:600}
.brand-sub{font-size:12px;color:var(--muted)}
nav.links{display:none;gap:26px;font-size:14px;font-weight:500}
nav.links a:hover{color:var(--cyan)}
.actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .2s,background .2s,border-color .2s;border:1px solid transparent}
.btn-ghost{padding:7px 14px;font-size:12.5px;background:transparent;border-color:var(--cyan-dim);color:var(--cyan-soft)}
.btn-ghost:hover{background:rgba(8,51,68,.6)}
.btn-solid{padding:9px 16px;font-size:14px;background:var(--cyan);color:var(--ink)}
.btn-solid:hover{filter:brightness(1.1)}
.btn-lg{padding:14px 24px;font-size:16px}
.btn-grad{background:linear-gradient(90deg,#06b6d4,var(--blue));color:#00131a;box-shadow:0 10px 24px rgba(0,229,255,.22)}
.btn-grad:hover{filter:brightness(1.1)}
.btn-dark{background:#0f172a;border-color:#334155;color:#fff;font-weight:600}
.btn-dark:hover{background:#1e293b}
.btn-dark .ico{color:var(--cyan)}
.hide-sm{display:none}

/* hero */
.hero{position:relative;padding-block:56px 80px;overflow:hidden}
.hero::before{content:"";position:absolute;inset-block-start:15%;inset-inline-start:50%;width:620px;height:620px;margin-inline-start:-310px;border-radius:50%;background:rgba(0,229,255,.1);filter:blur(140px);pointer-events:none}
.hero-grid{position:relative;display:grid;gap:48px;align-items:center}
.hero-text{text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;background:rgba(8,51,68,.8);border:1px solid var(--cyan-dim);color:var(--cyan-soft);font-size:12.5px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:ping 1.8s ease-in-out infinite}
@keyframes ping{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
h1{margin-block:22px 18px;font-weight:900;line-height:1.2;letter-spacing:-.01em}
h1 .name{display:block;font-size:clamp(44px,7vw,72px);color:var(--text-strong);letter-spacing:.02em}
h1 .sub{display:block;font-size:clamp(24px,3.6vw,40px);background:linear-gradient(90deg,#22d3ee,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.4;padding-block-end:4px}
.lead{font-size:clamp(16px,1.6vw,18.5px);color:#cbd5e1;max-width:640px;margin-inline:auto;line-height:1.9}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:560px;margin:26px auto 0}
.metric{padding:14px 8px;border-radius:14px;background:rgba(15,23,42,.8);border:1px solid var(--line-strong);text-align:center}
.metric strong{display:block;color:var(--cyan);font-size:clamp(16px,2vw,22px);font-weight:800;line-height:1.3}
.metric span{font-size:12.5px;color:var(--muted);line-height:1.5;display:block;margin-block-start:4px}
.cta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-block-start:28px}
.shot{position:relative;max-width:440px;width:100%;margin-inline:auto}
.shot::before{content:"";position:absolute;inset:-6px;border-radius:20px;background:linear-gradient(90deg,#06b6d4,var(--blue));filter:blur(16px);opacity:.4}
.shot-in{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--cyan-dim);background:#020617;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.shot-in img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 28%}
.shot-cap{position:absolute;inset-inline:0;inset-block-end:0;padding:44px 18px 14px;background:linear-gradient(to top,#000 0%,rgba(0,0,0,.82) 55%,transparent);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#cbd5e1}
.shot-cap .award{color:var(--amber);font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* sections */
section.block{padding-block:84px}
.alt{background:rgba(2,6,23,.55);border-block:1px solid #0f172a}
.head{text-align:center;max-width:780px;margin:0 auto 52px}
.eyebrow{color:var(--cyan);font-size:13.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h2{font-size:clamp(26px,3.6vw,38px);font-weight:800;color:var(--text-strong);line-height:1.4;margin-block:10px 12px}
.head p{color:var(--muted);font-size:clamp(15px,1.5vw,17px)}
.grid{display:grid;gap:22px}
.card{border-radius:var(--radius);padding:26px;transition:border-color .3s,transform .3s}
.card:hover{border-color:rgba(0,229,255,.5);transform:translateY(-3px)}
.card h3{font-size:18.5px;font-weight:700;color:var(--text-strong);margin-block-end:8px;line-height:1.5}
.card p{font-size:15px;color:var(--muted);line-height:1.85}
.badge-ico{width:50px;height:50px;border-radius:13px;background:var(--cyan-bg);border:1px solid var(--cyan-dim);display:grid;place-items:center;color:var(--cyan);font-size:24px;margin-block-end:18px}
.big-ico{font-size:38px;color:var(--cyan);margin-block-end:14px;display:block}
.big-ico.amber{color:var(--amber)}
.big-ico.blue{color:#60a5fa}
.kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--amber);margin-block-end:8px}
.card .answer{margin-block-start:14px;padding-block-start:14px;border-block-start:1px dashed rgba(0,229,255,.28);color:#cbd5e1}
.card .answer b{color:var(--cyan);font-weight:700}

/* table */
.tbl{border-radius:var(--radius);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;text-align:start;min-width:720px}
thead th{background:rgba(15,23,42,.92);color:var(--cyan-soft);font-size:13px;letter-spacing:.04em;padding:16px 22px;text-align:start;border-block-end:1px solid var(--line-strong);font-weight:700}
tbody td{padding:17px 22px;border-block-end:1px solid rgba(30,41,59,.6);vertical-align:top;line-height:1.75}
tbody tr:last-child td{border-block-end:0}
tbody tr:hover{background:rgba(15,23,42,.45)}
td.sub{font-weight:700;color:var(--text-strong);white-space:nowrap}
td.sub .ico{color:var(--cyan);font-size:18px;vertical-align:-3px;margin-inline-end:8px}
td.ben{color:var(--muted)}

/* team */
.team-head .crest{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(45deg,#06b6d4,var(--blue));display:grid;place-items:center;font-size:30px;color:#00131a;box-shadow:0 10px 26px rgba(0,229,255,.28)}
.inst{color:var(--cyan);font-weight:700;font-size:19px}
.faculty{color:#cbd5e1;font-size:15px;font-weight:500;margin-block:4px 12px}
.team{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.member{position:relative;text-align:center;padding:26px 16px 20px}
.member.lead-m{border-color:rgba(0,229,255,.5);box-shadow:0 10px 30px rgba(0,229,255,.1)}
.member img{width:116px;height:116px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:2px solid rgba(34,211,238,.45);box-shadow:0 8px 22px rgba(0,229,255,.18)}
.member.lead-m img{border-color:#22d3ee}
.member h3{font-size:17px;margin-block-end:2px}
.member .en{font-size:12.5px;color:var(--cyan-soft);margin-block-end:10px;direction:ltr}
.role{display:inline-block;padding:5px 12px;border-radius:12px;background:#0f172a;border:1px solid var(--line-strong);font-size:12.5px;color:#cbd5e1;line-height:1.6}
.lead-m .role{background:rgba(8,51,68,.8);border-color:var(--cyan-dim);color:var(--cyan-soft);font-weight:600}
.crown{position:absolute;inset-block-start:-13px;inset-inline-start:50%;transform:translateX(-50%);padding:3px 12px;border-radius:999px;background:var(--cyan);color:#000;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
[dir=rtl] .crown{transform:translateX(50%)}

/* visit */
.visit{border-radius:20px;padding:40px 28px;text-align:center;border:1px solid var(--cyan-dim);background:linear-gradient(135deg,rgba(8,51,68,.75),rgba(14,23,38,.9));box-shadow:0 0 34px rgba(0,229,255,.14)}
.visit h2{margin-block-start:0}
.visit p{color:#cbd5e1;max-width:720px;margin-inline:auto;font-size:16.5px}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-block-start:22px}
.fact{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(2,6,23,.6);border:1px solid var(--line-strong);font-size:14.5px;color:var(--text)}
.fact .ico{color:var(--cyan);font-size:18px}

footer{margin-block-start:auto;border-block-start:1px solid #0f172a;background:rgba(0,0,0,.6);padding-block:26px;font-size:13px;color:#64748b}
footer .wrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
footer b{color:#fff}
footer a{color:var(--cyan)}
footer a:hover{text-decoration:underline}

@media (min-width:640px){.hide-sm{display:inline-flex}.g2{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){nav.links{display:flex}.g3{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1024px){
  .hero-grid{grid-template-columns:7fr 5fr}
  .hero-text{text-align:start}
  .lead,.metrics{margin-inline:0}
  .cta-row{justify-content:flex-start}
  .g4{grid-template-columns:repeat(4,1fr)}
  footer .wrap{flex-direction:row;justify-content:space-between;text-align:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

@media print{
  :root{--bg:#fff;--panel:#fff;--line:#cbd5e1;--line-strong:#cbd5e1;--text:#0f172a;--text-strong:#0f172a;--muted:#334155;--cyan:#0e7490;--cyan-soft:#0e7490;--cyan-bg:#ecfeff;--cyan-dim:#67c5d6;--amber:#b45309}
  body{background:#fff;font-size:12px}
  header.top{position:static}
  .actions,nav.links,.cta-row,.hero::before,.shot::before,footer a{display:none!important}
  .glass{backdrop-filter:none;-webkit-backdrop-filter:none}
  .alt,.visit,.metric,.fact,.role,thead th,footer{background:#fff!important;box-shadow:none}
  .lead,.card .answer,.visit p,.faculty,.role,.shot-cap{color:#1e293b}
  .shot-cap{position:static;background:none;padding:8px 0}
  h1 .sub{color:#0e7490;background:none}
  section.block,.hero{padding-block:22px}
  .head{margin-block-end:18px}
  .card,.member,tr{break-inside:avoid}
  .hero-grid{grid-template-columns:7fr 4fr}.hero-text{text-align:start}.lead,.metrics{margin-inline:0}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  .team{grid-template-columns:repeat(5,1fr)}.member img{width:70px;height:70px}
  table{min-width:0;font-size:11px}
}
</style>
</head>

  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">A1</div>

        <div class="brand-name">AGENT <b>1</b> <span class="tag mono">UGV + ARM</span></div>

<main>
<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-text">
      <div class="pill"><span class="dot"></span><span data-i18n="badge-status"></span></div>
      <h1><span class="name">AGENT 1</span><span class="sub" data-i18n="hero-title-sub"></span></h1>
      <p class="lead" data-i18n="hero-desc"></p>
      <div class="metrics">
        <div class="metric"><strong>All-Terrain</strong><span data-i18n="metric-drive"></span></div>
        <div class="metric"><strong>Multi-DOF</strong><span data-i18n="metric-arm"></span></div>
        <div class="metric"><strong>Edge AI</strong><span data-i18n="metric-ai"></span></div>
      </div>
      <div class="cta-row">
        <a href="#about" class="btn btn-lg btn-grad"><svg class="ico"><use href="#i-compass"/></svg><span data-i18n="hero-cta-explore"></span></a>
        <button id="printBtn" type="button" class="btn btn-lg btn-dark"><svg class="ico"><use href="#i-print"/></svg><span data-i18n="hero-cta-pdf"></span></button>
      </div>
    </div>

let currentLang = 'en';
const langLabel = document.getElementById('langLabel');

function setLanguage(lang) {
  currentLang = lang;
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t['doc-title'];
  langLabel.textContent = lang === 'ar' ? 'English' : 'عربي';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.getAttribute('data-i18n')];
    if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-alt]').forEach(el => {
    const v = t[el.getAttribute('data-i18n-alt')];
    if (v) el.setAttribute('alt', v);
  });
}

document.getElementById('langToggle').addEventListener('click', () => setLanguage(currentLang === 'ar' ? 'en' : 'ar'));
document.getElementById('printBtn').addEventListener('click', () => window.print());
setLanguage(new URLSearchParams(location.search).get('lang') === 'ar' ? 'ar' : 'en');
